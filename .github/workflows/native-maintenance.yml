name: Native 26.1.2 maintenance release
on:
  push:
    branches: [mc-26.1.2]
    paths: ['tools/native-maintenance/READY.json']
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
concurrency:
  group: soil-native-maintenance-26-1-2
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.ref == 'refs/heads/mc-26.1.2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Record untouched main and apply verified native source
        run: |
          git ls-remote origin refs/heads/main | cut -f1 > /tmp/soil-main-before
          python3 tools/native-maintenance/apply.py
          git diff --check
      - name: Native compile, model tests and scale benchmark
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean test build soilScaleBenchmark
      - name: Check test results and packaged native identity
        run: |
          python3 - <<'PY'
          import json, pathlib, struct, tomllib, xml.etree.ElementTree as ET, zipfile
          roots = [ET.parse(p).getroot() for p in pathlib.Path('build/test-results/test').glob('TEST-*.xml')]
          counts = {k: sum(int(r.get(k, 0)) for r in roots) for k in ('tests', 'failures', 'errors', 'skipped')}
          assert counts == {'tests':93, 'failures':0, 'errors':0, 'skipped':0}, counts
          with zipfile.ZipFile('build/libs/foundations_soil-26.1.2-0.1.0-beta-port.2.jar') as z:
              meta = tomllib.loads(z.read('META-INF/neoforge.mods.toml').decode())
              assert meta['mods'][0]['version'] == '0.1.0-beta-port.2'
              deps = {d['modId']: d for d in meta['dependencies']['foundations_soil']}
              assert deps['minecraft']['versionRange'] == '[26.1.2]'
              assert deps['tfc']['type'] == deps['foundations_framework']['type'] == 'required'
              classes = [n for n in z.namelist() if n.endswith('.class')]
              assert len(classes) >= 181
              assert all(n.startswith('com/foundations/soil/') for n in classes)
              assert all(struct.unpack('>H', z.read(n)[6:8])[0] == 69 for n in classes)
              assert 'com/foundations/soil/soil/SoilDoseTransaction.class' in classes
              assert not any('Test' in n or 'ModelConfigFixture' in n for n in classes if n.startswith('com/foundations/soil/') and '/command/' not in n)
          pathlib.Path('build/reports/native-test-summary.json').write_text(json.dumps({
              'version':'0.1.0-beta-port.2', 'minecraft':'26.1.2', 'java':25,
              'counts':counts, 'native_class_count':len(classes), 'new_regression_tests':19,
              'tfc_runtime_tests_deferred':3,
              'game_launch':'not run; native TFC/Framework integration remains unverified'}, indent=2)+'\n')
          PY
      - name: Verify missing native runtime dependencies still fail explicitly
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon -PmodRuntimeTests=true help > build/reports/missing-runtime-dependency.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q 'Native runtime requires genuine tfc' build/reports/missing-runtime-dependency.log
      - name: Commit verified native implementation only
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin refs/heads/mc-26.1.2 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'Foundations Soil build bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm tools/native-maintenance/0?.patch tools/native-maintenance/READY.json
          git add -A -- src docs/ports/26.1.2 tools/native-maintenance CHANGELOG.md README.md RELEASING.md build_mod.bat gradle.properties
          git diff --cached --check
          git commit -m 'Native port.2: transactional liquid dosing and strict saved-data validation; 93 model tests pass'
          git push origin HEAD:refs/heads/mc-26.1.2
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(cat /tmp/soil-main-before)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state=success -f context='native-26.1.2/build-model-tests' -f description='Native compile and 93 model tests pass; full runtime remains unverified' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Assemble source, binary and evidence assets
        run: |
          mkdir -p build/release
          cp build/libs/*.jar build/release/
          cp build/reports/native-test-summary.json build/reports/soil-scale-benchmark.json build/release/
          cp docs/ports/26.1.2/PORT2_RELEASE_NOTES.md build/release/RELEASE_NOTES.md
          cp docs/ports/26.1.2/VALIDATION.md build/release/NATIVE_VALIDATION.md
          git archive --format=zip --output=build/release/Foundations_Soil-26.1.2-0.1.0-beta-port.2-SOURCE.zip HEAD
          (cd build && zip -qr release/Foundations_Soil-26.1.2-0.1.0-beta-port.2-TEST-REPORTS.zip reports test-results)
          (cd build/release && sha256sum *.jar *.zip *.json *.md > SHA256SUMS.txt)
      - name: Publish a new development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          tag='mc-26.1.2-v0.1.0-beta-port.2'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release exists; refusing to replace published assets.' >&2
            exit 1
          fi
          gh release create "$tag" --target "$SOURCE_SHA" --draft --prerelease --title 'Foundations Soil 26.1.2 — 0.1.0-beta-port.2 (development)' --notes-file docs/ports/26.1.2/PORT2_RELEASE_NOTES.md
          gh release upload "$tag" build/release/*
          gh release edit "$tag" --draft=false --prerelease --latest=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soil-native-port2-validation
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: soil-26.1.2-0.1.0-beta-port.2
          path: build/release/*
          if-no-files-found: error
