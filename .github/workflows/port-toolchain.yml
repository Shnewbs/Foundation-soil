name: Resolve 26.1.2 port toolchain
on:
  push:
    branches: [mc-26.1.2]
    paths: ['.github/workflows/port-toolchain.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve isolated Minecraft and NeoForge compiler dependencies
        shell: bash
        run: |
          mkdir -p /tmp/soil-native
          cp -r gradle gradlew settings.gradle /tmp/soil-native/
          cat > /tmp/soil-native/build.gradle <<'GRADLE'
          plugins {
              id 'java-library'
              id 'net.neoforged.moddev' version '2.0.148'
          }
          java.toolchain.languageVersion = JavaLanguageVersion.of(25)
          repositories { mavenCentral() }
          neoForge { version = '26.1.2.114' }
          dependencies {
              implementation platform('org.junit:junit-bom:5.11.4')
              implementation 'org.junit.jupiter:junit-jupiter'
              implementation 'org.junit.platform:junit-platform-launcher'
              implementation 'org.ow2.asm:asm-tree:9.8'
          }
          tasks.register('exportNative', Sync) {
              dependsOn tasks.named('createMinecraftArtifacts')
              from configurations.compileClasspath
              from configurations.runtimeClasspath
              duplicatesStrategy = DuplicatesStrategy.EXCLUDE
              into layout.buildDirectory.dir('native-libs')
          }
          GRADLE
          cd /tmp/soil-native
          chmod +x gradlew
          ./gradlew --no-daemon exportNative
          mkdir -p "$GITHUB_WORKSPACE/build/port-toolchain"
          cp build/native-libs/*.jar "$GITHUB_WORKSPACE/build/port-toolchain/"
          tar -czf "$GITHUB_WORKSPACE/build/port-toolchain/jdk25.tar.gz" -C "$JAVA_HOME" bin lib conf release legal
      - uses: actions/upload-artifact@v4
        with:
          name: soil-26.1.2-native-toolchain
          path: build/port-toolchain/*
          retention-days: 3
          if-no-files-found: error
