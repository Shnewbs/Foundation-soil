name: Build and test
on:
  push:
    branches: [main, 'mc-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read branch Java version
        id: platform
        run: python3 -c "import os,pathlib; p=dict(x.split('=',1) for x in pathlib.Path('gradle.properties').read_text().splitlines() if '=' in x); print('java='+p['java_version'], file=open(os.environ['GITHUB_OUTPUT'],'a'))"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.platform.outputs.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, test, and package
        run: ./gradlew --no-daemon clean test build
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soil-test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
      - name: Upload build JARs
        uses: actions/upload-artifact@v4
        with:
          name: foundations-soil-build
          path: build/libs/*.jar
          if-no-files-found: error
