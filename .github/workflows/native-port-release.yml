name: Native Soil 26.1.2 port release
on:
  push:
    branches: [mc-26.1.2]
    paths: ['tools/port-import/READY.json']
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
concurrency:
  group: soil-native-26-1-2-import
  cancel-in-progress: false
jobs:
  native:
    if: github.ref == 'refs/heads/mc-26.1.2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply checksum-verified native implementation
        run: |
          python3 tools/port-import/apply.py
          git diff --check
      - name: Native compile, model tests and scale benchmark
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean test build soilScaleBenchmark
      - name: Validate model-test counts and packaged native version
        run: |
          python3 - <<'PY'
          import json, pathlib, struct, tomllib, xml.etree.ElementTree as ET, zipfile
          roots = [ET.parse(p).getroot() for p in pathlib.Path('build/test-results/test').glob('TEST-*.xml')]
          counts = {key: sum(int(r.get(key, 0)) for r in roots) for key in ('tests','failures','errors','skipped')}
          assert counts == {'tests':74,'failures':0,'errors':0,'skipped':0}, counts
          jar = pathlib.Path('build/libs/foundations_soil-26.1.2-0.1.0-beta-port.1.jar')
          with zipfile.ZipFile(jar) as z:
              metadata = tomllib.loads(z.read('META-INF/neoforge.mods.toml').decode())
              assert metadata['mods'][0]['version'] == '0.1.0-beta-port.1'
              deps = {v['modId']:v for v in metadata['dependencies']['foundations_soil']}
              assert deps['minecraft']['versionRange'] == '[26.1.2]'
              assert deps['tfc']['type'] == deps['foundations_framework']['type'] == 'required'
              classes = [n for n in z.namelist() if n.endswith('.class')]
              assert len(classes) > 100
              assert all(n.startswith('com/foundations/soil/') for n in classes)
              assert all(struct.unpack('>H',z.read(n)[6:8])[0] == 69 for n in classes)
              assert 'assets/foundations_soil/items/soil_laboratory.json' in z.namelist()
              assert 'com/foundations/soil/ModelConfigFixture.class' not in z.namelist()
          pathlib.Path('build/reports/native-test-summary.json').write_text(json.dumps({
              'minecraft':'26.1.2','neoforge':'26.1.2.114','java':25,'counts':counts,
              'native_class_count':len(classes),'tfc_runtime_tests_deferred':3,
              'game_launch':'not run; genuine native TFC/Framework required'},indent=2)+'\n')
          PY
      - name: Confirm runtime dependency guards fail explicitly
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon -PmodRuntimeTests=true help > build/reports/missing-runtime-dependency.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q 'Native runtime requires genuine tfc' build/reports/missing-runtime-dependency.log
          set +e
          ./gradlew --no-daemon -PnativeRuntime=true -Ptfc_jar=../build/libs/foundations_soil-26.1.2-0.1.0-beta-port.1.jar help > build/reports/wrong-mod-identity.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q 'does not declare expected mod ID tfc' build/reports/wrong-mod-identity.log
      - name: Commit tested native source without overwriting concurrent changes
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin refs/heads/mc-26.1.2 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'Foundations Soil build bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf tools/port-import
          git add -A -- src tools docs build.gradle gradle.properties README.md RELEASING.md CHANGELOG.md CONFIGURATION.md DEVELOPMENT_LOG.md FIELD_LEDGER.md FOUNDATIONS_CANNABIS_SOIL_CONTRACT.md ROADMAP_0.1.md ROADMAP_TO_1.0.md build_mod.bat libs/README.txt .gitignore
          git diff --cached --check
          git commit -m 'Port Soil beta to native 26.1.2: codecs, GUI/input, fluid transactions and required TFC boundary; 74 model tests pass'
          git push origin HEAD:refs/heads/mc-26.1.2
          source="$(git rev-parse HEAD)"
          echo "sha=$source" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$source" -f state=success -f context='native-26.1.2/build-model-tests' -f description='Native compilation and 74 model tests passed; full TFC/Framework runtime remains unvalidated' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Assemble native development release assets
        run: |
          mkdir -p build/release
          cp build/libs/*.jar build/release/
          cp build/reports/native-test-summary.json build/reports/soil-scale-benchmark.json build/release/
          cp docs/ports/26.1.2/VALIDATION.md build/release/NATIVE_VALIDATION.md
          cp docs/ports/26.1.2/RELEASE_NOTES.md build/release/RELEASE_NOTES.md
          git archive --format=zip --output=build/release/Foundations_Soil-26.1.2-0.1.0-beta-port.1-SOURCE.zip HEAD
          (cd build && zip -qr release/Foundations_Soil-26.1.2-0.1.0-beta-port.1-TEST-REPORTS.zip reports test-results)
          (cd build/release && sha256sum *.jar *.zip *.json *.md > SHA256SUMS.txt)
      - name: Publish development prerelease, not stable/latest
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          tag='mc-26.1.2-v0.1.0-beta-port.1'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite.' >&2
            exit 1
          fi
          gh release create "$tag" --target "$SOURCE_SHA" --draft --prerelease --title 'Foundations Soil 26.1.2 — 0.1.0-beta-port.1 (development port)' --notes-file docs/ports/26.1.2/RELEASE_NOTES.md
          gh release upload "$tag" build/release/*
          gh release edit "$tag" --draft=false --prerelease --latest=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soil-26.1.2-validation
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: soil-26.1.2-0.1.0-beta-port.1
          path: build/release/*
          if-no-files-found: error
