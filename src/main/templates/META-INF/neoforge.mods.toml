modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Native Minecraft 26.1.2 development port of the 0.1.0-beta feature set. Requires genuine native TFC and Framework.
Compilation/model tests are not a completed gameplay or integration validation.
Foundations Soil extends TerraFirmaCraft with persistent 4x4 living-soil cells, Field Ledger/Field Guide tools,
and server-authoritative agronomy. Soil Probe diagnostics and saved field records combine TFC hydration and
N/P/K snapshots with soil condition, crop history, amendment status, and delayed TFC-calendar release.
Solid and physical liquid amendments support diminishing response and overapplication consequences.
TFC and compatible mods own fluid transport; Foundations Soil does not implement irrigation networks.
'''

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tfc"
type="required"
versionRange="${tfc_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="foundations_framework"
type="required"
versionRange="${framework_version_range}"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="foundations_soil.mixins.json"
