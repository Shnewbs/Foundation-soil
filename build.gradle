plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
java.withSourcesJar()

// Default tests exercise model/persistence code without claiming a successful game launch.
// -PmodRuntimeTests=true retains NeoForge's full mod-loading test environment.
def modRuntimeTests = providers.gradleProperty('modRuntimeTests').map { it.toBoolean() }.getOrElse(false)
if (modRuntimeTests && !file("libs/${project.framework_jar}").isFile()) {
    throw new GradleException("Full mod-runtime tests require the genuine Framework dependency at libs/${project.framework_jar}. No stub or optional-dependency fallback is used.")
}

repositories {
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'vazkii.patchouli' }
    }
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
    if (modRuntimeTests) {
        unitTest { enable(); testedMod = mods."${mod_id}" }
    }
}

configurations { runtimeClasspath.extendsFrom localRuntime }

dependencies {
    implementation "curse.maven:terrafirmacraft-302973:${tfc_file}"
    localRuntime 'vazkii.patchouli:Patchouli:1.21.1-92-NEOFORGE'
    testRuntimeOnly 'vazkii.patchouli:Patchouli:1.21.1-92-NEOFORGE'
    def frameworkJar = file("libs/${project.framework_jar}")
    if (frameworkJar.exists()) {
        compileOnly files(frameworkJar)
        localRuntime files(frameworkJar)
        testImplementation files(frameworkJar)
    }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

if (!modRuntimeTests) {
    sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
    sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath
}
test {
    useJUnitPlatform()
    systemProperty 'foundations.soil.testMode', modRuntimeTests ? 'mod-runtime' : 'model-only'
    testLogging { events 'failed', 'skipped'; exceptionFormat = 'full' }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        tfc_version_range: tfc_version_range,
        framework_version_range: framework_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
