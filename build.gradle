plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
java.withSourcesJar()

// The native addon can be compiled without loading TFC. Runtime NEVER substitutes for it.
def modRuntimeTests = providers.gradleProperty('modRuntimeTests').map { it.toBoolean() }.getOrElse(false)
def requestedLaunch = gradle.startParameter.taskNames.any { it.tokenize(':').last() in ['runClient', 'runServer'] }
def nativeRuntime = modRuntimeTests || requestedLaunch || providers.gradleProperty('nativeRuntime').map { it.toBoolean() }.getOrElse(false)
if (nativeRuntime) {
    apply from: 'tools/native-runtime.gradle'
    verifyNativeRuntimeJar(file("libs/${project.tfc_jar}"), 'tfc', project.minecraft_version)
    verifyNativeRuntimeJar(file("libs/${project.framework_jar}"), 'foundations_framework', project.minecraft_version)
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'vazkii.patchouli'; includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' }
    }
}

neoForge {
    version = project.neo_version
    // 26.1.2 is unobfuscated. No 1.21.1 Parchment coordinates or mappings are applied.
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
    if (modRuntimeTests) {
        unitTest { enable(); testedMod = mods."${mod_id}" }
    }
}

configurations { runtimeClasspath.extendsFrom localRuntime }

dependencies {
    // Loaded only for explicitly requested native runtime validation. Never use old 1.21.1 artifacts.
    if (nativeRuntime) {
        localRuntime files("libs/${project.tfc_jar}", "libs/${project.framework_jar}")
        localRuntime "vazkii.patchouli:patchouli-neoforge:${patchouli_version}"
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
        if (modRuntimeTests) {
            testRuntimeOnly files("libs/${project.tfc_jar}", "libs/${project.framework_jar}")
            testRuntimeOnly "vazkii.patchouli:patchouli-neoforge:${patchouli_version}"
            testRuntimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
        }
    }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.ow2.asm:asm-tree:9.8'
}

if (!modRuntimeTests) {
    sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
    sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath
}
test {
    useJUnitPlatform {
        if (modRuntimeTests) excludeTags 'model-only'
        else excludeTags 'tfc-runtime'
    }
    systemProperty 'foundations.soil.testMode', modRuntimeTests ? 'mod-runtime' : 'model-only'
    testLogging { events 'failed', 'skipped'; exceptionFormat = 'full' }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        tfc_version_range: tfc_version_range,
        framework_version_range: framework_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // String-target Mixins bind to genuine native TFC at runtime. No synthetic target classes.
    options.compilerArgs.add('-proc:none')
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('soilScaleBenchmark', JavaExec) {
    group = 'verification'
    description = 'Native model/storage microbenchmark; not a live-server TPS test.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.foundations.soil.SoilScaleBenchmark'
    maxHeapSize = '1500m'
    args layout.buildDirectory.file('reports/soil-scale-benchmark.json').get().asFile.absolutePath
    enabled = !modRuntimeTests
}
